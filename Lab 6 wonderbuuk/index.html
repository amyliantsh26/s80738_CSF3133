
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Quiz Application</h1>
        <p>Test Your Knowledge!</p>
    </header>

    <main class="quiz-container">

        <!-- Start Section -->
        <section id="start-section">
            <h2>Welcome to the Quiz!</h2>
            <p>Answer the questions before the time runs out.</p>
            <button id="start-btn" onclick="startQuiz()">
                Start Quiz
            </button>
        </section>

        <!-- Quiz Section -->
        <section id="quiz-section" style="display: none;">

            <div class="quiz-info">
                <p id="question-number">Question 1</p>
                <p id="score">Score: 0</p>
            </div>

            <div class="timer">
                Time Left: <span id="time">15</span> seconds
            </div>

            <h2 id="question">Question goes here</h2>

            <div id="answer-options">
                <!-- Answer options will appear here -->
            </div>

            <p id="feedback"></p>

            <div class="button-group">
                <button id="submit-btn" onclick="checkAnswer()">
                    Submit Answer
                </button>

                <button id="next-btn" onclick="nextQuestion()" disabled>
                    Next Question
                </button>
            </div>

        </section>

        <!-- Result Section -->
        <section id="result-section" style="display: none;">
            <h2>Quiz Completed!</h2>
            <p id="final-score"></p>
            <p id="result-message"></p>

            <button onclick="startQuiz()">
                Try Again
            </button>
        </section>

    </main>

    <footer>
        <p id="footer-score">Your score will appear here after finishing the quiz.</p>
        <p>&copy; 2026 Quiz Application</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
